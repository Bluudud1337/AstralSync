<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula AI Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Cosmic Background Styling */
        body { 
            background: radial-gradient(circle at bottom left, #1e1b4b, #000000); 
            height: 100vh;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        #chat-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="text-white flex flex-col font-sans">

    <header class="p-6 flex items-center justify-between glass">
        <div class="flex items-center gap-3">
            <svg class="w-10 h-10 text-cyan-400" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L14.4 9.6H22L15.8 14.2L18.2 21.8L12 17.2L5.8 21.8L8.2 14.2L2 9.6H9.6L12 2Z" />
            </svg>
            <h1 class="text-xl font-bold tracking-widest text-cyan-400">NEBULA AI</h1>
        </div>
        
        <select id="model-select" class="bg-gray-900 border border-gray-600 rounded p-2 text-sm text-cyan-300 outline-none">
            <option value="gpt-4o">GPT-4o (Standard)</option>
            <option value="gemini-pro">Gemini Pro (Advanced)</option>
            <option value="claude-3">Claude 3.5 Sonnet</option>
        </select>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-3xl mx-auto w-full">
        <div class="text-center text-gray-500 mt-10 text-sm italic">System initialized. Awaiting user command...</div>
    </main>

    <footer class="p-6 glass">
        <div class="max-w-3xl mx-auto relative">
            <input id="user-input" type="text" placeholder="Transmit a message to the AI..." 
                   class="w-full bg-gray-900 border border-gray-600 rounded-xl p-4 pr-16 outline-none focus:ring-2 focus:ring-cyan-500 text-white placeholder-gray-500">
            <button id="send-btn" class="absolute right-2 top-2 bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg font-bold transition">
                SEND
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');

        // Function to render messages
        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-4 rounded-xl max-w-2xl ${sender === 'user' ? 'bg-cyan-900/40 ml-auto' : 'glass'}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value;
            const model = modelSelect.value;
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // This is the link to your Vercel backend
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, model: model })
                });

                const data = await response.json();
                appendMessage('ai', data.reply);
            } catch (error) {
                appendMessage('ai', "Error: Transmission failed. Ensure the server is online.");
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>

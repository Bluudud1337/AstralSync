    &lt;style&gt;
        /* --- PROFESSIONAL GALAXY THEME --- */
        :root {
            --bg-base: #0B0E14;
            --bg-panel: #151B25;
            --bg-hover: #1F2735;
            --accent-primary: #3B82F6;

        }

        * {

        }

        body {
            background-color: var(--bg-base);

        /* --- HEADER &amp; NAVIGATION --- */
        header {

        .file-item:hover {

        .file-item.active {

        .file-item-name {
            display: flex;

            align-items: center;

            padding: 4px;
            border-radius: 4px;
        }

        .delete-file:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        /* --- EDITOR AREA --- */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            position: relative;
        }
        
        .editor-toolbar {
            background: var(--bg-base);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 45px;

        .file-breadcrumbs {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--text-muted);

            align-items: center;
            gap: 6px;
        }

        /* Container for Ace Editor */
        .editor-wrapper {
            flex: 1;
            position: relative;

        #code-editor {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            font-family: var(--font-code);

        /* --- PREVIEW AREA --- */
        .preview-container {
            width: 45%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            transition: width 0.3s ease;
        }

        .preview-container.hidden {
            width: 0;

        .preview-header {
            background: var(--bg-panel);

            display: flex;

        }

        iframe {
            flex: 1;
            border: none;

            background: #fff;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    &lt;/style&gt;

    &lt;/button&gt;

        &lt;div class=&quot;spaces-nav&quot; id=&quot;spaces-nav&quot;&gt;
            &lt;!-- Tabs injected via JS --&gt;
        &lt;/div&gt;
        &lt;div&gt;&lt;/div&gt; &lt;!-- Empty div to balance flex header --&gt;
    &lt;/header&gt;

    &lt;div class=&quot;workspace&quot;&gt;

                &lt;!-- Files injected via JS --&gt;

        &lt;div class=&quot;editor-container&quot;&gt;
            &lt;div class=&quot;editor-toolbar&quot;&gt;
                &lt;div class=&quot;file-breadcrumbs&quot;&gt;

                &lt;button class=&quot;btn&quot; id=&quot;toggle-preview-btn&quot; onclick=&quot;togglePreview()&quot;&gt;
                    &lt;i class=&quot;ph ph-layout&quot;&gt;&lt;/i&gt; &lt;span id=&quot;preview-btn-text&quot;&gt;Hide Preview&lt;/span&gt;
                &lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;editor-wrapper&quot;&gt;
                &lt;div id=&quot;code-editor&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;

        &lt;!-- Live Preview --&gt;
        &lt;div class=&quot;preview-container&quot; id=&quot;preview-container&quot;&gt;

                &lt;span style=&quot;display: flex; align-items: center; gap: 6px;&quot;&gt;
                    &lt;i class=&quot;ph ph-browser&quot;&gt;&lt;/i&gt; Live Preview
                &lt;/span&gt;
                &lt;div style=&quot;display: flex; gap: 8px;&quot;&gt;
                    &lt;button class=&quot;btn&quot; style=&quot;padding: 4px 8px; font-size: 0.8rem;&quot; onclick=&quot;openInNewTab()&quot;&gt;
                        &lt;i class=&quot;ph ph-arrow-square-out&quot;&gt;&lt;/i&gt; Pop Out
                    &lt;/button&gt;
                &lt;/div&gt;

        &lt;/div&gt;

    &lt;script&gt;
        // --- DEFAULT DATA ---
        const DEFAULT_HTML = `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;style&gt;
    body {
      background: #0B0E14;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #151B25;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #2D3748;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { color: #3B82F6; margin-bottom: 10px; }
    p { color: #8B949E; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h1&gt;AstralCode IDE 🚀&lt;/h1&gt;
    &lt;p&gt;Professional grade. Start coding to see live updates.&lt;/p&gt;
  &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;`;

        // Initialize Data
        const createDefaultSpaces = () =&gt; {
            return Array.from({ length: 5 }, (_, i) =&gt; ({
                id: i,
                name: `Space ${i + 1}`,
                files: [
                    { name: 'index.html', content: i === 0 ? DEFAULT_HTML : `&lt;h1&gt;Hello from Space ${i + 1}&lt;/h1&gt;` },
                    { name: 'styles.css', content: '/* Add your CSS here */' }
                ]
            }));
        };

        let spacesData = JSON.parse(localStorage.getItem('astralCodeData_v2'));
        if (!spacesData || spacesData.length !== 5) {
            spacesData = createDefaultSpaces();
        }

        let currentSpaceIndex = 0;
        let currentFileIndex = 0;
        let isPreviewVisible = true;
        let previewTimeout;

        // --- DOM ELEMENTS ---
        const spacesNav = document.getElementById('spaces-nav');
        const fileList = document.getElementById('file-list');
        const previewFrame = document.getElementById('preview-frame');
        const previewContainer = document.getElementById('preview-container');
        const previewBtnText = document.getElementById('preview-btn-text');
        const currentFileNameDisplay = document.getElementById('current-file-name');

        // --- ACE EDITOR SETUP ---
        const editor = ace.edit(&quot;code-editor&quot;);
        editor.setTheme(&quot;ace/theme/tomorrow_night_eighties&quot;);
        editor.session.setMode(&quot;ace/mode/html&quot;);
        editor.setOptions({
            fontSize: &quot;14px&quot;,
            showPrintMargin: false,
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            tabSize: 2,
            useWorker: false // Disables syntax linting errors for external scripts
        });

        // Event listener for editor changes
        editor.session.on('change', () =&gt; {
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile) {
                currentFile.content = editor.getValue();
                saveData();
                debouncedUpdatePreview();
            }
        });

        // --- CORE FUNCTIONS ---
        function saveData() {
            localStorage.setItem('astralCodeData_v2', JSON.stringify(spacesData));
        }

        function getFileIcon(filename) {
            if (filename.endsWith('.html')) return '&lt;i class=&quot;ph-fill ph-file-html&quot; style=&quot;color: #E34F26&quot;&gt;&lt;/i&gt;';
            if (filename.endsWith('.css')) return '&lt;i class=&quot;ph-fill ph-file-css&quot; style=&quot;color: #1572B6&quot;&gt;&lt;/i&gt;';
            if (filename.endsWith('.js')) return '&lt;i class=&quot;ph-fill ph-file-js&quot; style=&quot;color: #F7DF1E&quot;&gt;&lt;/i&gt;';
            if (filename.endsWith('.json')) return '&lt;i class=&quot;ph-fill ph-brackets-curly&quot; style=&quot;color: #8B949E&quot;&gt;&lt;/i&gt;';
            return '&lt;i class=&quot;ph-fill ph-file-text&quot; style=&quot;color: #8B949E&quot;&gt;&lt;/i&gt;';
        }

        function getEditorMode(filename) {
            if (filename.endsWith('.js')) return &quot;ace/mode/javascript&quot;;
            if (filename.endsWith('.css')) return &quot;ace/mode/css&quot;;
            if (filename.endsWith('.json')) return &quot;ace/mode/json&quot;;
            return &quot;ace/mode/html&quot;;
        }

        function renderSpacesNav() {
            spacesNav.innerHTML = '';
            spacesData.forEach((space, index) =&gt; {
                const btn = document.createElement('button');
                btn.className = `space-tab ${index === currentSpaceIndex ? 'active' : ''}`;
                btn.innerText = space.name;
                btn.onclick = () =&gt; switchSpace(index);
                spacesNav.appendChild(btn);
            });
        }

        function renderFileList() {
            fileList.innerHTML = '';
            const currentSpace = spacesData[currentSpaceIndex];
            
            currentSpace.files.forEach((file, index) =&gt; {
                const div = document.createElement('div');
                div.className = `file-item ${index === currentFileIndex ? 'active' : ''}`;
                div.onclick = () =&gt; switchFile(index);
                
                const nameContainer = document.createElement('div');
                nameContainer.className = 'file-item-name';
                nameContainer.innerHTML = `${getFileIcon(file.name)} &lt;span&gt;${file.name}&lt;/span&gt;`;
                
                div.appendChild(nameContainer);

                if (currentSpace.files.length &gt; 1) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-file';
                    deleteBtn.innerHTML = '&lt;i class=&quot;ph ph-trash&quot;&gt;&lt;/i&gt;';
                    deleteBtn.onclick = (e) =&gt; {
                        e.stopPropagation();
                        deleteFile(index);
                    };
                    div.appendChild(deleteBtn);
                }
                
                fileList.appendChild(div);
            });
        }

        function loadEditorContent() {
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile) {
                // Set value without triggering the 'change' event unnecessarily
                editor.setValue(currentFile.content, -1);
                editor.session.setMode(getEditorMode(currentFile.name));
                editor.setReadOnly(false);
                currentFileNameDisplay.innerText = currentFile.name;
                
                // Immediately update preview to the current file
                updatePreview();
            } else {
                editor.setValue('');
                editor.setReadOnly(true);
                currentFileNameDisplay.innerText = 'No files';
                previewFrame.srcdoc = '';
            }
        }

        // --- PREVIEW LOGIC ---
        function debouncedUpdatePreview() {
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(updatePreview, 500); // 500ms delay to prevent freezing
        }

        function updatePreview() {
            if (!isPreviewVisible) return;
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile &amp;&amp; currentFile.name.endsWith('.html')) {
                previewFrame.srcdoc = currentFile.content;
            } else if (currentFile) {
                // If viewing a non-html file, try to find an index.html to render instead, 
                // otherwise show a placeholder
                const htmlFile = spacesData[currentSpaceIndex].files.find(f =&gt; f.name.endsWith('.html'));
                if (htmlFile) {
                     previewFrame.srcdoc = htmlFile.content;
                } else {
                     previewFrame.srcdoc = `&lt;body style=&quot;font-family:sans-serif; padding:20px; color:#333;&quot;&gt;&lt;i&gt;Preview is only available for HTML files.&lt;/i&gt;&lt;/body&gt;`;
                }
            }
        }

        // --- ACTIONS ---
        function switchSpace(index) {
            currentSpaceIndex = index;
            currentFileIndex = 0;
            renderSpacesNav();
            renderFileList();
            loadEditorContent();
        }

        function switchFile(index) {
            currentFileIndex = index;
            renderFileList();
            loadEditorContent();
        }

        function addFile() {
            const fileName = prompt(&quot;Enter file name (e.g., script.js, style.css):&quot;, &quot;newfile.html&quot;);
            if (fileName &amp;&amp; fileName.trim() !== &quot;&quot;) {
                // Check for duplicates
                if(spacesData[currentSpaceIndex].files.some(f =&gt; f.name === fileName.trim())) {
                    alert(&quot;A file with that name already exists!&quot;);
                    return;
                }
                spacesData[currentSpaceIndex].files.push({ name: fileName.trim(), content: '' });
                currentFileIndex = spacesData[currentSpaceIndex].files.length - 1;
                saveData();
                renderFileList();
                loadEditorContent();
            }
        }

        function deleteFile(index) {
            if (confirm(`Are you sure you want to delete ${spacesData[currentSpaceIndex].files[index].name}?`)) {
                spacesData[currentSpaceIndex].files.splice(index, 1);
                if (currentFileIndex &gt;= spacesData[currentSpaceIndex].files.length) {
                    currentFileIndex = Math.max(0, spacesData[currentSpaceIndex].files.length - 1);
                }
                saveData();
                renderFileList();
                loadEditorContent();
            }
        }

        function togglePreview() {
            isPreviewVisible = !isPreviewVisible;
            if (isPreviewVisible) {
                previewContainer.classList.remove('hidden');
                previewBtnText.innerText = 'Hide Preview';
                updatePreview();
            } else {
                previewContainer.classList.add('hidden');
                previewBtnText.innerText = 'Show Preview';
            }
            // Trigger Ace editor resize event to fix sizing when flex container changes
            setTimeout(() =&gt; editor.resize(), 300);
        }

        function openInNewTab() {
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile &amp;&amp; currentFile.name.endsWith('.html')) {
                const newWindow = window.open('about:blank', '_blank');
                newWindow.document.write(currentFile.content);
                newWindow.document.close();
            } else {
                alert(&quot;Only HTML files can be opened in a new tab.&quot;);
            }
        }

        // --- INITIALIZATION ---
        renderSpacesNav();
        renderFileList();
        loadEditorContent();

    &lt;/script&gt;
&lt;/body&gt;
